<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torsadz' Hot Ones Challenge</title>
<style>
  :root{
    --bg-0:#0f0705;
    --bg-1:#2a0f08;
    --card:#1c0f0a;
    --card-edge:#3a1c12;
    --amber:#e8a33d;
    --amber-dim:#7a5a24;
    --text-0:#f5ece2;
    --text-1:#cdb6a9;
    --text-2:#8c6d5f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(1100px 650px at 12% -10%, var(--bg-1), transparent 62%),
      radial-gradient(900px 550px at 105% 108%, #250d09, transparent 55%),
      var(--bg-0);
    color:var(--text-0);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    display:flex;
    justify-content:center;
    padding:56px 20px 80px;
  }

  .stage{
    width:100%;
    max-width:600px;
  }

  header{
    margin-bottom:30px;
  }
  header h1{
    font-size:26px;
    font-weight:700;
    margin:0 0 8px;
    color:var(--text-0);
  }
  header p{
    margin:0;
    font-size:14px;
    color:var(--text-2);
  }
  header p b{
    color:var(--amber);
    font-weight:700;
  }

  .scale{
    display:flex;
    align-items:center;
    gap:3px;
    margin-top:14px;
  }
  .scale-bar{
    flex:1;
    height:4px;
    border-radius:2px;
    background:linear-gradient(90deg, #e8a33d, #e8442f 55%, #9c1620);
    opacity:.55;
  }
  .scale-label{
    font-size:11px;
    color:var(--text-2);
    white-space:nowrap;
  }

  .list{
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--card-edge);
  }

  .item{
    border-bottom:1px solid var(--card-edge);
  }

  .item-head{
    all:unset;
    box-sizing:border-box;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:20px 6px;
    cursor:pointer;
  }
  .item-head:focus-visible{
    outline:2px solid var(--heat, var(--amber));
    outline-offset:-2px;
    border-radius:6px;
  }

  .item-label{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .item-title-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .item-title{
    font-size:17px;
    font-weight:600;
    color:var(--text-0);
    transition: color .15s ease;
  }
  .item-head:hover .item-title{ color:var(--heat, var(--amber)); }

  .flames{
    display:flex;
    gap:2px;
  }
  .flames svg{
    width:13px;
    height:13px;
  }

  .chevron{
    width:18px;
    height:18px;
    flex:none;
    color:var(--text-2);
    transition: transform .25s ease, color .15s ease;
  }
  .item.open .chevron{
    transform: rotate(180deg);
    color:var(--heat, var(--amber));
  }

  .item-body{
    max-height:0;
    overflow:hidden;
    transition: max-height .3s cubic-bezier(.2,.8,.2,1);
  }
  .item-body-inner{
    padding:0 6px 24px;
  }

  .item-question{
    font-size:15.5px;
    line-height:1.6;
    color:var(--text-1);
    max-width:52ch;
  }

  .quiz-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
    max-width:52ch;
  }
  .quiz-option{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border:1px solid var(--card-edge);
    border-radius:10px;
    font-size:14.5px;
    color:var(--text-1);
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .quiz-option:hover{
    border-color:var(--amber-dim);
    color:var(--text-0);
  }
  .quiz-option .letter{
    font-weight:700;
    color:var(--text-2);
    font-size:12px;
    width:16px;
  }
  .quiz-option.correct{
    border-color:#5fae6b;
    background:rgba(95,174,107,.12);
    color:var(--text-0);
  }
  .quiz-option.correct .letter{ color:#5fae6b; }
  .quiz-option.incorrect{
    border-color:#c1554a;
    background:rgba(193,85,74,.12);
    color:var(--text-0);
  }
  .quiz-option.incorrect .letter{ color:#c1554a; }
  .quiz-option.disabled{
    cursor:default;
  }
  .quiz-result{
    margin-top:14px;
    font-size:13.5px;
    color:var(--text-2);
  }
  .quiz-result b{
    color:var(--text-0);
  }

  .photo-wrap{
    margin-top:18px;
  }
  .photo-wrap img{
    max-width:200px;
    width:100%;
    border-radius:10px;
    border:1px solid var(--card-edge);
    display:block;
    cursor: zoom-in;
    transition: transform .15s ease, border-color .15s ease;
  }
  .photo-wrap img:hover{
    transform: scale(1.02);
    border-color: var(--amber-dim);
  }
  .photo-hint{
    margin-top:8px;
    font-size:12px;
    color:var(--text-2);
  }

  .hint-toggle{
    all:unset;
    box-sizing:border-box;
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:18px;
    padding:10px 16px;
    border:1px dashed var(--card-edge);
    border-radius:999px;
    font-size:13.5px;
    color:var(--text-2);
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .hint-toggle:hover{
    border-color:var(--amber-dim);
    color:var(--amber);
  }
  .hint-photo-wrap{
    margin-top:16px;
    max-height:0;
    overflow:hidden;
    transition: max-height .3s cubic-bezier(.2,.8,.2,1);
  }
  .hint-photo-wrap img{
    max-width:100%;
    width:100%;
    border-radius:10px;
    border:1px solid var(--card-edge);
    display:block;
    cursor: zoom-in;
    margin-top:2px;
  }

  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(8,15,17,.88);
    display:none;
    align-items:center;
    justify-content:center;
    padding:32px;
    z-index:100;
    cursor:zoom-out;
  }
  .lightbox.open{
    display:flex;
    animation: fadeIn .2s ease forwards;
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .lightbox img{
    max-width:min(90vw, 700px);
    max-height:88vh;
    border-radius:12px;
    border:1px solid var(--card-edge);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.7);
  }
  .lightbox-close{
    position:absolute;
    top:20px;
    right:24px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--card-edge);
    color:var(--text-0);
    font-size:20px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .lightbox-close:hover{ border-color:var(--amber-dim); }

  @media (prefers-reduced-motion: reduce){
    .item-body, .chevron{ transition:none !important; }
  }
</style>
</head>

<div class="stage">
  <header>
    <h1>Torsadz' Hot Ones Challenge</h1>

  </header>

  <div class="list" id="list"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>

</div>

const FLAME_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>';

function heatColor(wingNumber, total){
  const t = (wingNumber - 1) / (total - 1);
  const hue = 42 - t * 47;
  const light = 56 - t * 10;
  return 'hsl(' + (hue < 0 ? hue + 360 : hue) + ', 78%, ' + light + '%)';
}

const listEl = document.getElementById('list');
const openCountEl = document.getElementById('openCount');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');

let openCount = 0;
const totalWings = QUESTIONS.length - 1;

QUESTIONS.forEach((q, i) => {
  const isWarmUp = i === 0;
  const wingNumber = i; // 1..10 for wings
  const heat = isWarmUp ? null : heatColor(wingNumber, totalWings);
  const flameCount = isWarmUp ? 0 : Math.min(5, Math.ceil(wingNumber / 2));

  const item = document.createElement('div');
  item.className = 'item';
  if(heat) item.style.setProperty('--heat', heat);

  const head = document.createElement('button');
  head.className = 'item-head';
  head.setAttribute('aria-expanded', 'false');

  let flamesHtml = '';
  if(flameCount > 0){
    flamesHtml = '<span class="flames" style="color:' + heat + '">' + FLAME_SVG.repeat(flameCount) + '</span>';
  }

  head.innerHTML =
    '<span class="item-label">' +
      '<span class="item-title-wrap">' +
        '<span class="item-title">' + q.label + '</span>' +
        flamesHtml +
      '</span>' +
    '</span>' +
    '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

  const body = document.createElement('div');
  body.className = 'item-body';

  const inner = document.createElement('div');
  inner.className = 'item-body-inner';

  let innerHtml = '<div class="item-question">' + q.text.replace(/\n/g, '<br><br>') + '</div>';
  if(q.quiz){
    const letters = ['A', 'B', 'C', 'D'];
    innerHtml += '<div class="quiz-options">' +
      q.quiz.options.map((opt, oi) =>
        '<button class="quiz-option" data-index="' + oi + '">' +
          '<span class="letter">' + letters[oi] + '</span><span>' + opt + '</span>' +
        '</button>'
      ).join('') +
      '</div>' +
      '<div class="quiz-result" id="quizResult-' + i + '"></div>';
  }
  if(q.photo){
    innerHtml += '<div class="photo-wrap"><img src="' + PHOTO_SRC + '" alt="Photo for this question" class="qPhoto"><div class="photo-hint">Tap to enlarge</div></div>';
  }
  if(q.hintPhoto){
    innerHtml += '<button class="hint-toggle" id="hintToggle-' + i + '">If you need help, look at this picture.</button>' +
      '<div class="hint-photo-wrap" id="hintPhotoWrap-' + i + '">' +
        '<img src="' + PIANO_PHOTO_SRC + '" alt="Grand piano cabinet diagram" class="hintPhoto">' +
      '</div>';
  }
  inner.innerHTML = innerHtml;
  body.appendChild(inner);

  item.appendChild(head);
  item.appendChild(body);
  listEl.appendChild(item);

  head.addEventListener('click', () => {
    const isOpen = item.classList.contains('open');
    if(isOpen){
      item.classList.remove('open');
      head.setAttribute('aria-expanded', 'false');
      body.style.maxHeight = '0px';
      openCount--;
    } else {
      item.classList.add('open');
      head.setAttribute('aria-expanded', 'true');
      body.style.maxHeight = inner.scrollHeight + 'px';
      openCount++;
    }
    openCountEl.textContent = openCount;
  });

  const photoImg = inner.querySelector('.qPhoto');
  if(photoImg){
    photoImg.addEventListener('click', (e) => {
      e.stopPropagation();
      openLightbox(PHOTO_SRC);
    });
  }

  if(q.quiz){
    const optionButtons = inner.querySelectorAll('.quiz-option');
    const resultEl = inner.querySelector('#quizResult-' + i);
    let answered = false;
    optionButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if(answered) return;
        answered = true;
        const chosenIndex = parseInt(btn.dataset.index, 10);
        optionButtons.forEach(b => {
          b.classList.add('disabled');
          const bi = parseInt(b.dataset.index, 10);
          if(bi === q.quiz.correct) b.classList.add('correct');
          else if(bi === chosenIndex) b.classList.add('incorrect');
        });
        const letters = ['A', 'B', 'C', 'D'];
        resultEl.innerHTML = chosenIndex === q.quiz.correct
          ? '<b>Correct!</b> The answer is ' + letters[q.quiz.correct] + '. ' + q.quiz.options[q.quiz.correct] + '.'
          : 'Not quite. The correct answer is <b>' + letters[q.quiz.correct] + '. ' + q.quiz.options[q.quiz.correct] + '</b>.';
        if(item.classList.contains('open')){
          body.style.maxHeight = inner.scrollHeight + 'px';
        }
      });
    });
  }

  if(q.hintPhoto){
    const hintToggle = inner.querySelector('#hintToggle-' + i);
    const hintWrap = inner.querySelector('#hintPhotoWrap-' + i);
    let hintOpen = false;
    hintToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      hintOpen = !hintOpen;
      hintWrap.style.maxHeight = hintOpen ? hintWrap.scrollHeight + 'px' : '0px';
      if(item.classList.contains('open')){
        setTimeout(() => { body.style.maxHeight = inner.scrollHeight + 'px'; }, 310);
      }
    });
    const hintImg = inner.querySelector('.hintPhoto');
    hintImg.addEventListener('click', (e) => {
      e.stopPropagation();
      openLightbox(PIANO_PHOTO_SRC);
    });
  }
});

function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.add('open');
}
function closeLightbox(){
  lightbox.classList.remove('open');
}
lightbox.addEventListener('click', (e) => {
  if(e.target === lightbox) closeLightbox();
});
lightboxClose.addEventListener('click', closeLightbox);
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeLightbox();
});
</script>
