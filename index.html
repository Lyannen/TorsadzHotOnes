<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11 Questions</title>
<style>
  :root{
    --bg-0:#0d1b1f;
    --bg-1:#132a30;
    --card:#16333a;
    --card-edge:#20444c;
    --amber:#e8a33d;
    --amber-dim:#7a5a24;
    --text-0:#f4efe4;
    --text-1:#b9c9cb;
    --text-2:#7d9195;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(1200px 700px at 15% -10%, var(--bg-1), transparent 60%),
      radial-gradient(1000px 600px at 110% 110%, #1a3038, transparent 55%),
      var(--bg-0);
    color:var(--text-0);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .stage{
    width:100%;
    max-width:620px;
  }

  .counter{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    font-size:14px;
    color:var(--text-2);
    letter-spacing:.01em;
  }
  .counter .n{
    font-variant-numeric: tabular-nums;
    color:var(--text-1);
  }
  .counter .n b{
    color:var(--amber);
    font-weight:700;
  }

  .dots{
    display:flex;
    gap:7px;
  }
  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--card-edge);
    transition: background .25s ease, transform .25s ease;
  }
  .dot.done{ background:var(--amber-dim); }
  .dot.active{ background:var(--amber); transform:scale(1.35); }

  .card{
    position:relative;
    background:linear-gradient(180deg, var(--card), #122a30);
    border:1px solid var(--card-edge);
    border-radius:18px;
    padding:56px 40px;
    min-height:280px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.55);
    overflow:hidden;
  }

  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--amber), transparent);
    opacity:.6;
  }

  .tag{
    font-size:13px;
    color:var(--amber);
    margin-bottom:18px;
    min-height:16px;
  }

  .question{
    font-size:23px;
    line-height:1.5;
    color:var(--text-0);
    max-width:46ch;
    opacity:0;
    transform: translateY(10px);
  }
  .question.reveal{
    animation: rise .55s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }

  .photo-wrap{
    margin-top:26px;
    opacity:0;
  }
  .photo-wrap.reveal{
    animation: rise .55s cubic-bezier(.2,.8,.2,1) .15s forwards;
  }
  .photo-wrap img{
    max-width:220px;
    width:100%;
    border-radius:10px;
    border:1px solid var(--card-edge);
    display:block;
    cursor: zoom-in;
    transition: transform .15s ease, border-color .15s ease;
  }
  .photo-wrap img:hover{
    transform: scale(1.02);
    border-color: var(--amber-dim);
  }
  .photo-hint{
    margin-top:8px;
    font-size:12px;
    color:var(--text-2);
  }

  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(8,15,17,.88);
    display:none;
    align-items:center;
    justify-content:center;
    padding:32px;
    z-index:100;
    cursor:zoom-out;
  }
  .lightbox.open{
    display:flex;
    animation: fadeIn .2s ease forwards;
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .lightbox img{
    max-width:min(90vw, 700px);
    max-height:88vh;
    border-radius:12px;
    border:1px solid var(--card-edge);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.7);
  }
  .lightbox-close{
    position:absolute;
    top:20px;
    right:24px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--card-edge);
    color:var(--text-0);
    font-size:20px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .lightbox-close:hover{ border-color:var(--amber-dim); }

  .hidden-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }
  .veil-label{
    color:var(--text-2);
    font-size:14px;
  }

  button{
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    border:none;
    cursor:pointer;
    border-radius:999px;
    padding:13px 30px;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  button:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:3px;
  }
  .btn-primary{
    background:var(--amber);
    color:#211404;
    box-shadow: 0 8px 20px -8px rgba(232,163,61,.6);
  }
  .btn-primary:hover{ transform:translateY(-1px); }
  .btn-primary:active{ transform:translateY(0); }

  .nav{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:26px;
  }
  .btn-ghost{
    background:transparent;
    color:var(--text-1);
    border:1px solid var(--card-edge);
    padding:11px 22px;
  }
  .btn-ghost:hover{ border-color:var(--amber-dim); color:var(--text-0); }
  .btn-ghost:disabled{
    opacity:.35;
    cursor:default;
  }
  .btn-ghost:disabled:hover{ border-color:var(--card-edge); color:var(--text-1); }

  .intro{
    text-align:center;
  }
  .intro h1{
    font-size:26px;
    margin:0 0 12px;
    font-weight:700;
    color:var(--text-0);
  }
  .intro p{
    color:var(--text-1);
    font-size:15px;
    margin:0 0 28px;
    line-height:1.6;
  }

  .done-state h2{
    font-size:22px;
    margin:0 0 8px;
  }
  .done-state p{
    color:var(--text-1);
    font-size:15px;
    margin:0;
  }

  @media (max-width:480px){
    .card{ padding:40px 22px; min-height:240px; }
    .question{ font-size:19px; }
  }

  @media (prefers-reduced-motion: reduce){
    .question, .photo-wrap{ animation:none !important; opacity:1 !important; transform:none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="counter" id="counter" style="display:none">
    <div class="n">Question <b id="curNum">1</b> / <span id="totalNum">11</span></div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="card" id="card">
    <div class="intro" id="intro">
      <h1>11 Questions</h1>
      <p>One question at a time &mdash; you decide when the next one shows up.</p>
      <button class="btn-primary" id="startBtn">Let&rsquo;s go</button>
    </div>
  </div>

  <div class="nav" id="nav" style="display:none">
    <button class="btn-ghost" id="prevBtn">&larr; Back</button>
    <button class="btn-primary" id="nextBtn">Next &rarr;</button>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <img src="" alt="Photo, enlarged" id="lightboxImg">
</div>

let idx = -1; // -1 = intro screen
const card = document.getElementById('card');
const counter = document.getElementById('counter');
const nav = document.getElementById('nav');
const curNum = document.getElementById('curNum');
const totalNum = document.getElementById('totalNum');
const dotsEl = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

totalNum.textContent = QUESTIONS.length;

QUESTIONS.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.id = 'dot-' + i;
  dotsEl.appendChild(d);
});

function updateDots(){
  QUESTIONS.forEach((_, i) => {
    const d = document.getElementById('dot-' + i);
    d.classList.toggle('active', i === idx);
    d.classList.toggle('done', i < idx);
  });
}

function renderQuestion(){
  const q = QUESTIONS[idx];
  curNum.textContent = idx + 1;
  updateDots();

  let html = '<div class="tag">' + (q.tag || '') + '</div>';
  html += '<div class="question reveal">' + q.text.replace(/\n/g, '<br><br>') + '</div>';
  if(q.photo){
    html += '<div class="photo-wrap reveal">' +
              '<img src="' + PHOTO_SRC + '" alt="Photo for this question" id="qPhoto">' +
              '<div class="photo-hint">Tap to enlarge</div>' +
            '</div>';
  }
  card.innerHTML = html;

  const qPhoto = document.getElementById('qPhoto');
  if(qPhoto){
    qPhoto.addEventListener('click', () => openLightbox(PHOTO_SRC));
  }

  prevBtn.disabled = idx === 0;
  nextBtn.textContent = idx === QUESTIONS.length - 1 ? 'Done' : 'Next \u2192';
}

function renderDone(){
  card.innerHTML =
    '<div class="done-state">' +
      '<h2>That\u2019s all of them.</h2>' +
      '<p>All ' + QUESTIONS.length + ' questions have been asked.</p>' +
    '</div>';
  nav.style.display = 'none';
}

document.getElementById('startBtn').addEventListener('click', () => {
  idx = 0;
  counter.style.display = 'flex';
  nav.style.display = 'flex';
  renderQuestion();
});

nextBtn.addEventListener('click', () => {
  if(idx < QUESTIONS.length - 1){
    idx++;
    renderQuestion();
  } else {
    renderDone();
  }
});

prevBtn.addEventListener('click', () => {
  if(idx > 0){
    idx--;
    renderQuestion();
  }
});

document.addEventListener('keydown', (e) => {
  if(lightbox.classList.contains('open')){
    if(e.key === 'Escape') closeLightbox();
    return;
  }
  if(e.key === 'ArrowRight') nextBtn.click();
  if(e.key === 'ArrowLeft' && !prevBtn.disabled) prevBtn.click();
});

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');

function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.add('open');
}
function closeLightbox(){
  lightbox.classList.remove('open');
}
lightbox.addEventListener('click', (e) => {
  if(e.target === lightbox) closeLightbox();
});
lightboxClose.addEventListener('click', closeLightbox);
</script>
